apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-backend
  namespace: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-backend
  template:
    metadata:
      labels:
        app: api-backend
    spec:
      hostNetwork: false
      containers:
        - name: api-backend
          image: myregistry/api-backend:1.4.2
          securityContext:
            privileged: false
            runAsUser: 0
          resources:
            limits:
              memory: "512Mi"
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
